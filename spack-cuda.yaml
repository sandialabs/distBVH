spack:
  definitions:
    - mpis:
      - mpich@3.4.2
    - core-packages:
      - kokkos@4.7.01 +cuda +wrapper +cuda_lambda cuda_arch=61 cxxstd=20
      - fmt@10.2.1
      - spdlog@1.13.0
    - packages:
      - p3a@main
      - seacas@2024-04-03 -x11 ^hdf5@1.14.1 ^fmt@10.2.1
      - arborx@1.7 +openmp +mpi
      - darma-vt +kokkos +trace_enabled@1.7.0
  specs:
    - matrix:
      - [$mpis]
      - [arch=linux-ubuntu20.04-x86_64_v3]
    - matrix:
      - [$core-packages]
      - [arch=linux-ubuntu20.04-x86_64_v3]
    - matrix:
      - [$packages]
      - [$^mpis]
      - [arch=linux-ubuntu20.04-x86_64_v3]
  concretizer:
    unify: true
  config:
    install_tree:
      root: /opt/software
  view: /opt/view
  packages:
    all:
      variants:
      - cuda_arch=61
    cuda:
      buildable: false
      externals:
      - spec: cuda@12.4.0
        prefix: /usr/local/cuda
